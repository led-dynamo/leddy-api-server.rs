[package]
name = "leddy-api-server"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/led-dynamo/leddy-api-server.rs"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
leddy-interfaces = { git = "https://github.com/led-dynamo/leddy-interfaces" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
